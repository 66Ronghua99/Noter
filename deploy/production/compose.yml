services:
  api:
    image: ${NOTER_API_IMAGE:?NOTER_API_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${NOTER_ENV_FILE:-/opt/noter/.env}
    expose:
      - "3000"
    networks:
      - noter_private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok) process.exit(1); })
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NOTER_API_DOMAIN: ${NOTER_API_DOMAIN:?NOTER_API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - noter_private
      - caddy_egress

volumes:
  caddy_data:
  caddy_config:

networks:
  noter_private:
    internal: true
  caddy_egress:
